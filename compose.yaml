services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: ostrakon-napcat
    restart: unless-stopped
    env_file:
      - runtime.env
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1001}"
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config

  bot:
    build:
      context: .
    container_name: ostrakon-bot
    restart: unless-stopped
    depends_on:
      - napcat
    env_file:
      - runtime.env
    volumes:
      - ostrakon-data:/data

volumes:
  ostrakon-data:
