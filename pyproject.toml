[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ostrakon"
version = "0.1.0"
description = "Reaction-vote based QQ group moderation for NapCat/OneBot 11"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "websockets>=15.0,<16",
]

[project.scripts]
ostrakon = "ostrakon.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
